<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1510" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Foundry Bridge</title>
  </head>
  <body>
    <div id="game"></div>

    <aside id="worldContext" hidden>
      <div class="context-name" id="worldContextName"></div>
      <div class="context-actions" id="worldContextActions"></div>
      <span class="context-tail" aria-hidden="true"></span>
    </aside>

    <div id="hud" hidden>
      <div id="combatBanner" hidden></div>
      <div id="floatLog"></div>
      <footer class="hud-bar">
        <button id="connPip" class="pip bad" type="button" title="Connection">●</button>
        <div class="vitals">
          <div class="who" id="heroName">—</div>
          <div class="hp-row">
            <div class="hp-track"><div id="hpFill"></div></div>
            <span id="hpText">HP —</span>
          </div>
          <div id="conditions" class="conditions"></div>
        </div>
        <div class="hud-actions">
          <button type="button" data-sheet="act" data-icon="attack"><span class="button-icon" style="--icon-url:url('/icons/attack.svg')"></span>Act</button>
          <button type="button" data-sheet="bag" data-icon="items"><span class="button-icon" style="--icon-url:url('/icons/items.svg')"></span>Bag</button>
          <button type="button" data-sheet="chat" data-icon="talk"><span class="button-icon" style="--icon-url:url('/icons/talk.svg')"></span>Chat</button>
        </div>
      </footer>
      <div id="actionBar" style="display: none;" class="action-bar"></div>
      <p id="chatPeek" class="chat-peek"></p>
    </div>

    <section id="sheet" class="sheet" hidden>
      <header>
        <strong id="sheetTitle">Chat</strong>
        <button type="button" id="sheetClose">Close</button>
      </header>
      <div id="sheetBody"></div>
      <form id="chatForm" class="chat-form" hidden>
        <select id="chatChannel">
            <option value="all">Public</option>
          <option value="party">Party</option>
          <option value="npc">NPC</option>
        </select>
        <input id="chatText" autocomplete="off" placeholder="Say something…" />
        <button type="submit">Send</button>
      </form>
    </section>

    <section id="interact" class="sheet" hidden>
      <header>
        <strong id="interactTitle">Interact</strong>
        <button type="button" id="interactClose">Close</button>
      </header>
      <div id="interactBody"></div>
    </section>

    <section id="connect" class="screen">
      <div class="card">
        <h1>Foundry Bridge</h1>
        <p class="sub">Join the table. Foundry is the world; this is your character.</p>
        <label>Handle<input id="name" value="Hero" /></label>
        <label>Room<input id="room" value="default" autocomplete="off" /></label>
        <label>Character<select id="joinCharacter"><option value="">Connect the DM first</option></select></label>
        <label class="advanced">Gateway URL<input id="url" /></label>
        <button type="button" id="connectBtn">Enter the world</button>
        <p id="connectStatus" class="status">Disconnected</p>
      </div>
    </section>

    <section id="claim" class="screen" hidden>
      <div class="card">
        <h1>Choose your character</h1>
        <p class="sub" id="sceneName">Waiting for the scene…</p>
        <div id="characterList" class="character-list"></div>
        <button type="button" class="ghost" id="backToConnect">Disconnect</button>
      </div>
    </section>

    <section id="debug" hidden>
      <header>
        <strong>Debug</strong>
        <button type="button" id="debugClose">Close</button>
      </header>
      <pre id="debugLog"></pre>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
